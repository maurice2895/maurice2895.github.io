<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" fill="none"><style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><title>업무 절차·담당 역할·인수인계를 연결하는 기준표 그래픽</title><rect width="720" height="440" fill="#234BEE"/><text x="36" y="44" font-size="11" letter-spacing="3" fill="#DCE4FF">DENTALSOLVE / WORK STANDARD</text><rect x="46" y="91" width="628" height="294" fill="#1634AC"/><rect x="36" y="80" width="628" height="294" fill="#F3F2EC"/><rect x="36" y="80" width="14" height="294" fill="#171F30"/><text x="76" y="126" font-size="26" font-weight="700" fill="#171F30">함께 쓰는 업무 기준</text><path d="M76 149H628M76 207H628M76 265H628M76 323H628M225 149V323M422 149V323" stroke="#C4C8C0"/><g font-size="17" fill="#4C5565"><text x="92" y="187">업무 절차</text><text x="243" y="187">담당 역할</text><text x="440" y="187">확인 방법</text><text x="92" y="245">자료 위치</text><text x="243" y="245">공유 기준</text><text x="440" y="245">변경 이력</text><text x="92" y="303">직원 교육</text><text x="243" y="303">인수인계</text><text x="440" y="303">현장 점검</text></g><text x="36" y="415" font-size="11" letter-spacing="2" fill="#DCE4FF">A STANDARD THAT STAYS.</text></svg>

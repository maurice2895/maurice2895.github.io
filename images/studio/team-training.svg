<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" fill="none"><style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><title>설명·실습·확인으로 연결하는 직원 실무 교육 그래픽</title><rect width="720" height="440" fill="#F3F2EC"/><text x="36" y="44" font-size="11" letter-spacing="3" fill="#565F71">DENTALSOLVE / TEAM EDUCATION</text><path d="M36 72H684M36 370H684" stroke="#BFC2BC"/><path d="M74 258L348 258L348 166L626 166" stroke="#234BEE" stroke-width="2"/><rect x="60" y="136" width="180" height="190" fill="#DFE5F4"/><rect x="270" y="111" width="180" height="190" fill="#171F30"/><rect x="480" y="86" width="180" height="190" fill="#234BEE"/><text x="80" y="169" font-size="12" fill="#566580">01 / UNDERSTAND</text><text x="80" y="232" font-size="35" font-weight="700" fill="#171F30">설명</text><text x="80" y="293" font-size="15" fill="#566580">시스템을 이해하고</text><text x="290" y="144" font-size="12" fill="#ACB9D2">02 / PRACTICE</text><text x="290" y="207" font-size="35" font-weight="700" fill="#FFF">실습</text><text x="290" y="268" font-size="15" fill="#CDD6E6">직접 적용하고</text><text x="500" y="119" font-size="12" fill="#DAE2FF">03 / REVIEW</text><text x="500" y="182" font-size="35" font-weight="700" fill="#FFF">확인</text><text x="500" y="243" font-size="15" fill="#DAE2FF">함께 점검합니다</text><text x="36" y="413" font-size="11" letter-spacing="2" fill="#565F71">ONE SYSTEM. ONE TEAM.</text></svg>

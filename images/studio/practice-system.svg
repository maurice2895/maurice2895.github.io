<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 720 800" fill="none"><title>전자차트·직원 교육·AI를 연결하는 운영 시스템</title><style>
text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.sheet-a{animation:back 4.6s cubic-bezier(.2,.7,.2,1) both}.sheet-c{animation:front 4.6s cubic-bezier(.2,.7,.2,1) both}.trace{stroke-dasharray:1000;stroke-dashoffset:1000;animation:trace 2s 1.2s forwards}
@keyframes back{0%{transform:translate(30px,-30px);opacity:.35}55%,100%{transform:none;opacity:1}}@keyframes front{0%{transform:translate(-35px,65px);opacity:0}75%,100%{transform:none;opacity:1}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.trace{stroke-dashoffset:0}}

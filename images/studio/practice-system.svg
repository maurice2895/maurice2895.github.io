<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200" fill="none">
<title>전자차트와 교육이 하나의 운영 시스템으로 연결되는 덴탈솔브 그래픽</title>
<style>
text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.sheet-a{animation:sheetA 4.6s cubic-bezier(.2,.7,.2,1) both}.sheet-b{animation:sheetB 4.6s cubic-bezier(.2,.7,.2,1) both}.sheet-c{animation:sheetC 4.6s cubic-bezier(.2,.7,.2,1) both}.trace{stroke-dasharray:1000;stroke-dashoffset:1000;animation:trace 3s .4s ease-out forwards}.rule{transform-box:fill-box;transform-origin:left;animation:rule 1.3s 1.6s both}
@keyframes sheetA{0%{transform:translate(-60px,50px) rotate(-5deg);opacity:.4}50%,100%{transform:translate(0,0);opacity:1}}
@keyframes sheetB{0%{transform:translate(120px,-90px) rotate(5deg);opacity:.3}65%,100%{transform:translate(0,0);opacity:1}}
@keyframes sheetC{0%{transform:translate(70px,130px);opacity:0}75%,100%{transform:translate(0,0);opacity:1}}
@keyframes trace{to{stroke-dashoffset:0}}@keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.trace{stroke-dashoffset:0}}
</style>
<rect width="1080" height="1200" fill="#234BEE"/>
<g stroke="#FFFFFF" stroke-opacity=".12"><path d="M80 0V1200M310 0V1200M540 0V1200M770 0V1200M1000 0V1200M0 100H1080M0 350H1080M0 600H1080M0 850H1080M0 1100H1080"/></g>

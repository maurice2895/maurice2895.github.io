name: Website checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-check:
    name: HTML, links, sitemap and JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate HTML pages and internal links
        run: python scripts/site_check.py

      - name: Verify SEO and mapping regression guards
        run: |
          python scripts/test_site_check.py
          python scripts/test_indexnow.py

      - name: Check JavaScript syntax
        run: |
          node --check site.js
          node --check security.js
          node scripts/test_site_js.cjs

      # Cloudflare Pages가 쓰는 빌드 스크립트가 정상 동작하는지 확인합니다.
      - name: Check Cloudflare Pages build
        run: bash scripts/build-site.sh


name: Live site check

# 배포된 실제 주소를 점검합니다. 자동으로 돌지 않고, 필요할 때 수동으로만 실행합니다.
# (Actions 탭 → Live site check → Run workflow, 또는 gh workflow run live-check.yml)
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "점검할 주소 (예: https://dentalsolve.pages.dev 또는 https://dentalsolve.kr)"
        required: true
        default: "https://dentalsolve.kr"

permissions:
  contents: read

jobs:
  live-check:
    name: Status codes, redirects and headers
    runs-on: ubuntu-latest
    steps:
      # 네임서버 변경(가비아 → Cloudflare)이 반영됐는지 확인합니다.
      # .kr 등록소에 직접 묻는 값이 가장 정확하고, 공용 DNS 값은 캐시 때문에 늦게 바뀔 수 있습니다.
      - name: Check DNS for dentalsolve.kr
        run: |
          set -u
          kr_ns=$(dig +short NS kr. | head -1)
          echo "== .kr 등록소($kr_ns)에 등록된 네임서버"
          dig +norecurse +noall +authority NS dentalsolve.kr. @"$kr_ns" | awk '{print $5}' | sort
          for r in 8.8.8.8 1.1.1.1; do
            echo "== 공용 DNS $r"
            echo "NS:    $(dig +short NS dentalsolve.kr. @$r | sort | tr '\n' ' ')"
            echo "A:     $(dig +short A dentalsolve.kr. @$r | sort | tr '\n' ' ')"
            echo "www:   $(dig +short CNAME www.dentalsolve.kr. @$r | tr '\n' ' ')"
          done

      - name: Check public pages, assets and indexing
        env:
          BASE: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          BASE="${BASE%/}"
          failures=0
          body=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$body" "$headers"' EXIT
          paths="/ /about/ /consulting/ /oneclick/ /standardization/ /ai-training/ /emr-button-guide/ /faq/ /members/ /sitemap.xml /robots.txt /rss.xml /llms.txt /site.js /site.css /security.js /og-image.png /googlef97ab000014e40e4.html /naver133c3117ea7348c1738597f91a5a3d64.html"
          for p in $paths; do
            if ! code=$(curl --silent --show-error --location --max-redirs 5 --connect-timeout 10 --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$BASE$p"); then
              echo "::error::Connection failed: $p"
              failures=$((failures + 1))
              continue
            fi
            echo "$p -> $code"
            if [ "$code" != 200 ]; then
              echo "::error::Expected HTTP 200: $p"
              failures=$((failures + 1))
              continue
            fi
            case "$p" in
              /|/about/|/consulting/|/oneclick/|/standardization/|/ai-training/|/emr-button-guide/|/faq/)
                if grep -Eiq '^x-robots-tag:.*noindex' "$headers" || grep -Eiq '<meta[^>]*name="robots"[^>]*content="[^"]*noindex' "$body"; then
                  echo "::error::Public page unexpectedly noindex: $p"
                  failures=$((failures + 1))
                fi
                ;;
              /members/)
                if ! grep -Eiq '<meta[^>]*name="robots"[^>]*content="[^"]*noindex' "$body"; then
                  echo "::error::Member entry page must remain noindex"
                  failures=$((failures + 1))
                fi
                ;;
              /robots.txt)
                if ! grep -Fq 'Sitemap: https://dentalsolve.kr/sitemap.xml' "$body"; then
                  echo "::error::robots.txt sitemap mapping missing"
                  failures=$((failures + 1))
                fi
                ;;
            esac
          done
          if code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' "$BASE/no-such-page/"); then
            if [ "$code" != 404 ]; then
              echo "::error::Unknown page should return HTTP 404, received $code"
              failures=$((failures + 1))
            fi
          else
            echo "::error::404 check could not connect"
            failures=$((failures + 1))
          fi
          echo "Live check failures: $failures"
          test "$failures" -eq 0
